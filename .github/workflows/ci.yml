name: Continous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Update Data"]
    types: [completed]

jobs:
  lint:
    name: Typecheck, Lint & Test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Dependencies
        uses: ./.github/composite-actions/setup
      - name: Run Lint All
        run: bun ci:check
      - uses: MeilCli/common-lint-reporter/transformer/eslint@v1.2.1
        if: always()
        with:
          report_files: |
            lint_report.json
      - name: Unit Test
        run: bun ci:test
      - name: 'Report Coverage'
        # Set if: always() to also generate the report if tests are failing
        # Only works if you set `reportOnFailure: true` in your vite config as specified above
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2

  server:
    name: Server Typecheck & Test
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sorter
          POSTGRES_PASSWORD: sorter
          POSTGRES_DB: sorter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U sorter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sorter:sorter@localhost:5433/sorter_test
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Dependencies
        uses: ./.github/composite-actions/setup
      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: server
        run: bun run type-check
      - name: Test
        working-directory: server
        run: bun test
