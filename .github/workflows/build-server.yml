name: Build Ranking Server

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'src/utils/**'
      - 'src/types/**'
      - 'src/components/sorter/CharacterFilters.tsx'
      - 'src/components/sorter/SongFilters.tsx'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

jobs:
  build-push:
    name: Build and Push Server Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.ham-san.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: registry.ham-san.net/the-sorter-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
